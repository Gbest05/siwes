<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="siwesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0062FF"/>
      <stop offset="100%" stop-color="#00DF81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#siwesGrad)" stroke-width="2.5" stroke-opacity="0.8"/>
  
  <!-- Graduation Cap -->
  <polygon points="32,13 52,23 32,33 12,23" fill="url(#siwesGrad)" filter="url(#glow)"/>
  
  <!-- Cap Underside Arc -->
  <path d="M20,27.5 L20,38 C20,44 44,44 44,38 L44,27.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tassel Cord & Fringe -->
  <path d="M48,24.5 L50,35 L47.5,39.5 L52.5,39.5 L50,35" fill="#00DF81" stroke="#00DF81" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Industry Gear/Star Hub below -->
  <circle cx="32" cy="48" r="6" fill="#0A0E1A" stroke="url(#siwesGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="48" r="2.5" fill="#00DF81"/>
</svg>
